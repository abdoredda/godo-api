services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: godo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: godo
    volumes:
      - godo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godo -d godo"]
      interval: 2s
      timeout: 2s
      retries: 10

  db_test:
    image: postgres:17
    environment:
      POSTGRES_USER: godo
      POSTGRES_PASSWORD: password
      POSTGRES_DB: godo_test
    ports:
      - "5433:5432"
    volumes:
      - godo-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godo -d godo_test"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy

volumes:
  godo-data:
  godo-test-data:
